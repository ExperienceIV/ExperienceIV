<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Fira Code','DejaVu Sans Mono',monospace">
  <style>
    .bg { fill: #0D1117; stroke: #00F5FF; stroke-width: 2; }
    .title { fill: #00F5FF; font-size: 20px; font-weight: 700; }
    .sub { fill: #8B949E; font-size: 12px; }
    .label { fill: #C9D1D9; font-size: 14px; }
    .val { fill: #FF00FF; font-size: 13px; font-weight: 700; }
    .track { fill: #161B22; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s ease-out both; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
    .b5 { animation-delay: .6s } .b6 { animation-delay: .75s }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .cursor { fill: #00F5FF; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .warn { fill: #FF5555; font-size: 12px; animation: blink 1.4s steps(1) infinite; }
  </style>
  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#FF00FF"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient>
  </defs>
  <rect class="bg" x="2" y="2" width="816" height="356" rx="10"/>
  <text class="title" x="24" y="38">◤ ПЕРСОНАЖ: LUZI ◢</text>
  <text class="sub" x="24" y="58">Класс: медик-кибернетик · Ур. 3 (курс) · Локация: Нижний Новгород</text>
  <text class="warn" x="560" y="38">⚠ ОБНАРУЖЕН НЕДОСЫП</text>

  <g transform="translate(24,84)">
    <text class="label" x="0" y="16">Python</text>
    <rect class="track" x="190" y="2" width="460" height="18" rx="4"/>
    <rect class="bar" x="190" y="2" width="368" height="18" rx="4" fill="url(#g1)"/>
    <text class="val" x="664" y="16">80/100</text>

    <text class="label" x="0" y="52">C++</text>
    <rect class="track" x="190" y="38" width="460" height="18" rx="4"/>
    <rect class="bar b2" x="190" y="38" width="345" height="18" rx="4" fill="url(#g1)"/>
    <text class="val" x="664" y="52">75/100</text>

    <text class="label" x="0" y="88">Терпение к Fedora</text>
    <rect class="track" x="190" y="74" width="460" height="18" rx="4"/>
    <rect class="bar b3" x="190" y="74" width="322" height="18" rx="4" fill="url(#g1)"/>
    <text class="val" x="664" y="88">70/100</text>

    <text class="label" x="0" y="124">Бессонница</text>
    <rect class="track" x="190" y="110" width="460" height="18" rx="4"/>
    <rect class="bar b4" x="190" y="110" width="437" height="18" rx="4" fill="url(#g2)"/>
    <text class="val" x="664" y="124">95/100</text>

    <text class="label" x="0" y="160">Тяга к хрому</text>
    <rect class="track" x="190" y="146" width="460" height="18" rx="4"/>
    <rect class="bar b5" x="190" y="146" width="460" height="18" rx="4" fill="url(#g2)"/>
    <text class="val" x="664" y="160">MAX</text>

    <text class="label" x="0" y="196">Здравый смысл</text>
    <rect class="track" x="190" y="182" width="460" height="18" rx="4"/>
    <rect class="bar b6" x="190" y="182" width="55" height="18" rx="4" fill="#FF5555"/>
    <text class="val" x="664" y="196">12/100</text>
  </g>

  <text class="label" x="24" y="320">Инвентарь: ноутбук, чай, дедлайны, план выспаться</text>
  <text class="sub" x="24" y="342">Активный квест: «Сделать из человека киборга (легально)»</text>
  <rect class="cursor" x="520" y="331" width="9" height="14"/>
</svg>
